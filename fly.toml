# fly.toml app configuration file generated for nvnmchain-explorer on 2026-08-08T19:21:39+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nvnmchain-explorer'
primary_region = 'sin'

# Built from the repo Dockerfile by `fly deploy`.
[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/explorer.db'
  INDEX_WS = '0'
  NATIVE_SYMBOL = 'NVNM'
  RUST_LOG = 'nvnmchain_explorer=info'

[[mounts]]
  source = 'nvnm_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 100

  [[services.http_checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
