# Postgres for development and tests only; production does not use this file.
#
#   docker compose up -d --wait
#   PG_TEST_URL=postgres://explorer:explorer@localhost:5432/explorer \
#       cargo test --test postgres -- --include-ignored
#
# PG_PORT picks another host port when 5432 is taken. See docs/database.md.
services:
  postgres:
    image: postgres:18.6 # same tag as .github/workflows/postgres.yml
    # Each test opens small pools of its own; the default 100 runs out.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: explorer
      POSTGRES_DB: explorer
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports: ["${PG_PORT:-5432}:5432"]
    # 18+ keeps its data under /var/lib/postgresql/18/docker.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d explorer"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
