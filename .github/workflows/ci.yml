name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint + format (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --lib --test decoder --test anchoring --test pages --test baseline

      - name: Run live RPC integration tests
        run: cargo test --test live_rpc
        env:
          NVNM_RPC: https://rpc.nvnm.canary.mantrachain.dev
          # Lets the suite past the RPC's Cloudflare rate limits. Empty on fork
          # PRs, which GitHub gives no secrets: those run without it.
          NVNM_RPC_API_KEY: ${{ secrets.NVNM_RPC_API_KEY }}
