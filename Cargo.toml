[package]
name = "nvnmchain-explorer"
version = "0.1.0"
edition = "2021"
description = "nvnmchain blockchain explorer (Rust)"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
ethers-core = "2"
tera = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }

# Tempo tx types: RLP-decode the typed 0x76 transaction
# (https://tempo.xyz/developers/docs/sdk/rust)
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", tag = "tempo-alloy@1.10.1" }
alloy-eips = "2"
alloy-primitives = "1"
alloy-consensus = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
