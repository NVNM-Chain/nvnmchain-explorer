[package]
name = "nvnmchain-explorer"
version = "0.1.0"
edition = "2021"
description = "nvnmchain blockchain explorer (Rust)"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
ethers-core = "2"
tera = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }

# The chain's own crates: its tx types to RLP-decode the typed 0x76 transaction, and every
# precompile interface as Solidity the compiler checks rather than ABI JSON vendored here.
tempo-primitives = { git = "https://github.com/NVNM-Chain/nvnmchain-tempo", rev = "f55ca164df" }
tempo-contracts = { git = "https://github.com/NVNM-Chain/nvnmchain-tempo", rev = "f55ca164df", default-features = false, features = ["std"] }
alloy-eips = "2"
alloy-json-abi = "1"
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-consensus = "2"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
