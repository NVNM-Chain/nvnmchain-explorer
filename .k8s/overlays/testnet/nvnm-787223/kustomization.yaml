apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvnm-tempo-testnet-1-applications
# chainNetwork + chain_id on every rendered object's metadata. includeSelectors is false
# because spec.selector on an existing Deployment/StatefulSet is immutable.
# includeTemplates is NOT used: it also writes
# spec.volumeClaimTemplates[].metadata.labels, which is immutable on an existing
# StatefulSet and fails the sync. Pod templates are labelled by the patches below.
labels:
  - pairs:
      chainNetwork: nvnm-tempo-testnet-1
      chain_id: nvnm-tempo-testnet-1
    includeSelectors: false
patches:
  - target:
      kind: (Deployment|StatefulSet)
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/chainNetwork
        value: nvnm-tempo-testnet-1
      - op: add
        path: /spec/template/metadata/labels/chain_id
        value: nvnm-tempo-testnet-1
resources:
  - ../../../base/
  - resources/host_mapping.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - envs:
      - resources/env.yaml
    name: nvnmchain-explorer-env-variables
images:
  - name: ghcr.io/nvnm-chain/nvnmchain-explorer
    newTag: "v1.4.0"
