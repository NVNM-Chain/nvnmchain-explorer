apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

# Service specific configuration
helmCharts:
- name: generic-helm-chart
  repo: https://mantra-chain.github.io/generic-helm-chart
  version: 0.4.9
  releaseName: nvnmchain-explorer
  valuesFile: values.yaml
  valuesInline:
    nameOverride: nvnmchain-explorer
    fullnameOverride: nvnmchain-explorer
