# Render blueprint (optional managed-PaaS path, same Dockerfile).
# Deploys on the Starter plan (always-on) with a 1 GB persistent disk for
# SQLite. Free-tier Render instances sleep, which would pause the indexer.
services:
  - type: web
    name: nvnmchain-explorer
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /
    disk:
      name: nvnm-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DB_PATH
        value: /data/explorer.db
      - key: RUST_LOG
        value: nvnmchain_explorer=info
