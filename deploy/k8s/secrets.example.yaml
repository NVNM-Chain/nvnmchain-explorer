# Each deployment's database password, and nothing else: the URL and the user
# are not secret, and live in the manifests. In production these Secrets are
# synced from Secret Manager (for example by External Secrets Operator)
# rather than applied from a file; this shows their shape only.
#
# With CloudNativePG, use the operator-generated Secrets instead, which carry
# `username` and `password` keys.
apiVersion: v1
kind: Secret
metadata:
  name: explorer-indexer-db
type: Opaque
stringData:
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: explorer-web-db
type: Opaque
stringData:
  password: change-me
